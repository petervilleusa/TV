<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Every media path in app.js is written relative to the root, and clicking a
     channel pushes a new address (/pleeay/) WITHOUT loading a new document.
     Relative URLs are resolved against the document's current address, so
     without this the pictures went looking for /pleeay/media/... and every one
     of them 404'd. Reloading appeared to fix it only because that loads the
     generated page, which has always carried this tag. -->
<base href="/">
  <meta name="description" content="Records, cassettes, set lists and logos from the band Pleeay.">
  <link rel="canonical" href="https://petervilleusa.onrender.com/pleeay/">
  <title>Pleeay — PETERVILLE USA</title>

  <link rel="icon" href="/media/meta/icon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/media/meta/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/media/meta/apple-touch-icon.png">

  <!-- What a link to this site looks like when somebody pastes it somewhere.
       The image is JPEG on purpose: every picture on the site is WebP, but the
       scrapers behind these previews are far older than browsers and several
       of them will not render WebP at all, which shows up as no card and no
       error to explain it. The URL has to be absolute for the same reason. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PETERVILLE USA">
  <meta property="og:title" content="Pleeay — PETERVILLE USA">
  <meta property="og:description" content="Records, cassettes, set lists and logos from the band Pleeay.">
  <meta property="og:url" content="https://petervilleusa.onrender.com/pleeay/">
  <meta property="og:image" content="https://petervilleusa.onrender.com/media/meta/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A wall of old televisions and a Peavey amplifier, each screen playing something different.">
  <meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <!-- Sits in the drawer's slot, behind it. With a project open, closing the
       drawer slides the channel list away and reveals this instead of bare
       page — a texture belonging to that project. -->
  <i id="backdrop" aria-hidden="true"></i>

  <nav id="panel" data-open="false">
    <ul id="nav-list"></ul>

    <footer id="credits">
      <p>Thank you</p>
      <ul>
        <li>Sonic Youth</li>
        <li>Nam June Paik</li>
      </ul>
      <p id="copyright">&copy; Peter Warren</p>
    </footer>
  </nav>

  <!-- One scene, one coordinate space. Back to front: the room, cable behind
       the sets, the televisions, then cable draping in front of them. -->
  <div id="stage" data-expanded="">
    <!-- Sky behind everything. Only seen through the ceiling cut out of the
         background photograph, and above the scene on very tall windows —
         something you have to go looking for. -->
    <!-- The file is named in data-src, not src, so a hidden video costs no
         download. app.js wires it up only if the CSS ever unhides it. -->
    <video id="sky" muted loop playsinline preload="none" data-src="media/sky.mp4"></video>

    <div id="scene">
      <div class="layer" id="room"></div>
      <div class="layer" id="wires-back"></div>
      <div class="layer" id="wall"></div>
      <div class="layer" id="wires-front"></div>
    </div>
  </div>

  <!-- An open project's content. Built from that object's `content` blocks;
       fills the same area the media grows into. -->
  <article id="project" hidden></article>

  <i id="logo" aria-hidden="true"></i>

  <!-- both live outside nav so mix-blend-mode can read the whole page as backdrop -->
  <button id="toggle" aria-expanded="false" aria-controls="nav-list" aria-label="Menu">
    <span class="bar bar-h"></span>
    <span class="bar bar-v"></span>
  </button>
  <button id="close" aria-label="Close" data-cursor="close">
    <span class="bar bar-h"></span>
    <span class="bar bar-v"></span>
  </button>

  <!-- The pointer, made of the same two strokes as every other control here.
       It is inert until app.js decides this is a machine with a real mouse;
       without JavaScript, or on a touch screen, the system cursor is simply
       left alone. -->
  <i id="pointer" aria-hidden="true">
    <span class="bar bar-h"></span>
    <span class="bar bar-v"></span>
    <i id="pointer-chev"></i>
    <span id="pointer-word"></span>
  </i>
</main>

<script src="app.js"></script>
</body>
</html>
